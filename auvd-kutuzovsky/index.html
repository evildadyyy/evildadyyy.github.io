<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Академия УВД Кутузовского федерального округа в RMRP. Видеолекции, тесты и библиотека для курсантов.">
  <title>АУВД Кутузовский</title><meta property="og:site_name" content="АУВД Кутузовский"><meta property="og:title" content="АУВД Кутузовский"><meta property="og:description" content="Учебный портал Академии УВД Кутузовского округа"><meta property="og:url" content="https://evildadyyy.github.io/auvd-kutuzovsky/">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f2f1f8;
      --panel: #fff;
      --ink: #1c1830;
      --muted: #575367;
      --line: #dcd9e7;
      --brand: #5743b9;
      --wash: #eae6fa;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15131d;
        --panel: #201d2b;
        --ink: #f1eefb;
        --muted: #bcb7ce;
        --line: #454052;
        --brand: #b6a5ff;
        --wash: #352d50;
      }
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100svh; margin: 0; background: var(--bg); color: var(--ink); display: grid; place-items: center; padding: 20px; }
    main { width: min(100%, 760px); background: var(--panel); border: 1px solid var(--line); border-radius: 28px; overflow: hidden; }
    header { display: flex; align-items: center; gap: 12px; padding: 24px clamp(24px, 6vw, 52px); border-bottom: 1px solid var(--line); }
    .monogram { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border-radius: 13px; background: var(--wash); color: var(--brand); font-size: 29px; font-weight: 800; line-height: 1; }
    header p { margin: 0; font-size: 14px; line-height: 1.4; font-weight: 600; }
    article { padding: clamp(32px, 7vw, 64px) clamp(24px, 6vw, 52px); }
    h1 { margin: 0; font-size: clamp(40px, 8vw, 72px); line-height: 1.02; letter-spacing: -.045em; }
    article p { max-width: 48ch; margin: 20px 0 32px; font-size: clamp(16px, 2vw, 19px); line-height: 1.55; color: var(--muted); }
    nav { display: flex; flex-wrap: wrap; gap: 10px; }
    a { min-height: 46px; display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); font-size: 15px; font-weight: 600; text-decoration: none; }
    a.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
    @media (max-width: 450px) { nav { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="monogram" aria-hidden="true">А</span>
      <p>Кутузовский федеральный округ<br> RMRP</p>
    </header>
    <article>
      <h1>Академия УВД</h1>
      <p>Учебный портал для курсантов. Смотрите видеолекции, проходите тесты и сверяйтесь с правилами проекта и игровым законодательством.</p>
      <nav aria-label="Разделы Академии">
        <a class="primary" href="./site/">Открыть академию</a>
        <a href="./kabinet/">Кабинет инструкторов</a>
      </nav>
    </article>
  </main>
</body>
</html>
